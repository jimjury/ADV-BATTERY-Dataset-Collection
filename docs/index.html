<script data-bundled="storage.js">
/* Local-first persistence. A blocked/quota-limited store falls back to memory,
   reports the failure, and still permits a complete backup. */
(() => {
  const cache = new Map();
  let failed = false;
  const signal = () => { failed = true; window.dispatchEvent(new Event('battery-storage-error')); };
  window.BatteryStore = {
    getItem(key) { if (cache.has(key)) return cache.get(key); try { return localStorage.getItem(key); } catch { signal(); return null; } },
    setItem(key, value) { const text = String(value); cache.set(key, text); try { localStorage.setItem(key, text); } catch { signal(); } },
    removeItem(key) { cache.delete(key); try { localStorage.removeItem(key); } catch { signal(); } },
    get failed() { return failed; },
    json(key, fallback) { try { const value = JSON.parse(this.getItem(key)); return value == null ? fallback : value; } catch { return fallback; } }
  };
})();

</script><script>

.network-orbit ellipse{fill:none;stroke:color-mix(in srgb,var(--teal) 32%,transparent);stroke-dasharray:3 7}.network-edge{stroke:color-mix(in srgb,var(--teal) 48%,transparent);stroke-linecap:round;opacity:.68}.network-topic-node,.network-focus-center,.network-focus-tags g,.network-focus-papers g,.network-focus-datasets g{cursor:pointer;outline:none}.network-topic-node:hover .network-node-core,.network-topic-node:focus-visible .network-node-core{fill:var(--acid);stroke:var(--ink);stroke-width:2}.network-topic-node:hover .network-node-halo,.network-topic-node:focus-visible .network-node-halo{opacity:1}.network-node-halo{fill:color-mix(in srgb,var(--teal) 18%,transparent);stroke:color-mix(in srgb,var(--teal) 38%,transparent);opacity:.55;transition:.2s}.network-node-core{fill:var(--teal);stroke:var(--paper);stroke-width:2;transition:.2s}.network-node-count{fill:#fff;text-anchor:middle;font:700 12px var(--mono);pointer-events:none}.network-node-label{fill:var(--ink);text-anchor:middle;font:700 12px var(--sans);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;pointer-events:none}.network-center-mark circle{fill:var(--ink);stroke:var(--acid);stroke-width:2}.network-center-mark path{fill:none;stroke:var(--acid);stroke-width:2}.network-center-mark text{fill:var(--muted);text-anchor:middle;font:700 9px var(--mono);letter-spacing:.13em}.network-focus-rings circle{fill:none;stroke:color-mix(in srgb,var(--teal) 32%,transparent);stroke-dasharray:4 8}.network-edge-active{stroke:var(--teal);stroke-dasharray:3 7;animation:networkFlow 2.8s linear infinite}.network-edge-data{stroke:var(--acid);stroke-dasharray:2 6}.network-focus-center circle{fill:var(--ink);stroke:var(--acid);stroke-width:3}.network-focus-center text{fill:var(--paper);text-anchor:middle;font:700 18px var(--serif);pointer-events:none}.network-focus-center .network-focus-count{fill:var(--acid);font:700 10px var(--mono)}.network-related-tag{fill:var(--teal);stroke:var(--paper);stroke-width:2}.network-small-label{fill:var(--ink);text-anchor:middle;font:700 10px var(--sans);pointer-events:none}.network-paper-dot{fill:var(--acid);stroke:var(--ink);stroke-width:2;transition:.18s}.network-focus-papers g:hover .network-paper-dot,.network-focus-papers g:focus-visible .network-paper-dot{fill:var(--teal);transform:scale(1.16);transform-origin:center}.network-paper-index{fill:var(--ink);text-anchor:middle;font:700 10px var(--mono);pointer-events:none}.network-paper-label,.network-dataset-label{fill:var(--ink);text-anchor:middle;font:700 9px var(--sans);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;pointer-events:none}.network-dataset-box{fill:var(--ink);stroke:var(--acid);stroke-width:2}.network-focus-datasets g:hover .network-dataset-box,.network-focus-datasets g:focus-visible .network-dataset-box{fill:var(--teal)}.network-dataset-symbol{fill:var(--acid);text-anchor:middle;font:700 16px var(--mono);pointer-events:none}.network-extra{fill:var(--muted);text-anchor:middle;font:700 11px var(--mono)}

<section class="shell calculator-grid">
<article class="calculator-card" data-calc="crate"><span>01</span><h2>C-rate 与电流</h2><label>额定容量 Q (Ah)<input min="0" name="capacity" step="any" type="number" value="2.9"/></label><label>电流 I (A)<input name="current" step="any" type="number" value="2.9"/></label><output>1.000 C</output><p>C-rate = |I| / Qrated</p></article>
<article class="calculator-card" data-calc="soh"><span>02</span><h2>容量 SOH</h2><label>实测最大容量 (Ah)<input min="0" name="measured" step="any" type="number" value="2.32"/></label><label>额定/初始容量 (Ah)<input min="0" name="rated" step="any" type="number" value="2.9"/></label><output>80.00%</output><p>SOH = Qmax / Qrated × 100%</p></article>
<article class="calculator-card" data-calc="energy"><span>03</span><h2>恒值近似能量</h2><label>平均电压 (V)<input name="voltage" step="any" type="number" value="3.65"/></label><label>平均电流 (A)<input name="current" step="any" type="number" value="2"/></label><label>持续时间 (h)<input min="0" name="hours" step="any" type="number" value="1"/></label><output>7.300 Wh</output><p>E ≈ Vavg × Iavg × t；变电压工况应对 V·I 积分</p></article>
<article class="calculator-card" data-calc="resistance"><span>04</span><h2>脉冲直流内阻</h2><label>阶跃前电压 V₀ (V)<input name="v0" step="any" type="number" value="3.72"/></label><label>阶跃后电压 V₁ (V)<input name="v1" step="any" type="number" value="3.61"/></label><label>电流变化 |ΔI| (A)<input min="0" name="di" step="any" type="number" value="5"/></label><output>22.00 mΩ</output><p>R = |V₁ − V₀| / |ΔI|；必须注明脉冲取点时间</p></article>
<article class="calculator-card" data-calc="derivative"><span>05</span><h2>ICA / DVA 两点估算</h2><label>容量变化 ΔQ (Ah)<input name="dq" step="any" type="number" value="0.02"/></label><label>电压变化 ΔV (V)<input name="dv" step="any" type="number" value="0.01"/></label><output>dQ/dV = 2.000 Ah/V<br/>dV/dQ = 0.500 V/Ah</output><p>真实曲线需先重采样、平滑，再用多点数值微分</p></article>
<article class="calculator-card safety-card"><span>!</span><h2>计算前检查</h2><ul><li>确认电流正负号和 A / mA 单位</li><li>时间统一为秒或小时后再积分</li><li>容量和 SOH 必须在一致测试条件下比较</li><li>内阻必须记录 SOC、温度与脉冲宽度</li></ul><a href="#/knowledge">查看方法与注意事项 →</a></article>
</section>

<script data-bundled="data.js">window.BATTERY_DATA = {"tools":[{"name":"PyBaMM","code":"PY","type":"电化学建模","desc":"开源 Python 电池数学建模框架，内置 DFN、SPM、SPMe 和热模型。","url":"https://www.pybamm.org/"},{"name":"BEEP","code":"BE","type":"数据处理","desc":"TRI 发布的电池循环数据解析、结构化、特征生成与早期预测工具。","url":"https://github.com/TRI-AMDD/beep"},{"name":"BatteryML","code":"BM","type":"机器学习基准","desc":"面向电池寿命预测的数据预处理、特征工程和模型评估工具箱。","url":"https://github.com/microsoft/BatteryML"},{"name":"batteryDAT","code":"DA","type":"数据分析","desc":"Imperial College 发布的电池循环数据加载、清洗和退化分析 Python 工具。","url":"https://github.com/ImperialCollegeLondon/batteryDAT"},{"name":"COMSOL","code":"CO","type":"多物理场仿真","desc":"适用于电池热管理、电化学与结构耦合问题的商业有限元平台。","url":"https://www.comsol.com/batteries-and-fuel-cells-module"},{"name":"MATLAB / Simulink","code":"MA","type":"系统级建模","desc":"用于等效电路、BMS 算法和系统级控制策略的建模与验证。","url":"https://www.mathworks.com/solutions/battery-systems.html"},{"name":"Battery-Timer","code":"BT","type":"电池基础模型","desc":"面向容量退化预测的开源基础模型项目，附公开训练数据入口和复现实验说明。","url":"https://github.com/sjtu-chan-joey/Battery-Timer"}],"knowledge":[{"id":"states","category":"基础指标","title":"SOC、SOH、SOE、RUL 与 EOL","summary":"先统一定义，模型结果才可比较。","formula":"SOC = Qremain / Qavailable；SOH_Q = Qmax / Qrated × 100%；SOE = Eremain / Eavailable","body":"SOC 表示当前可用容量比例；SOH 常用容量或内阻相对基准表述；SOE 考虑电压变化后的剩余能量；RUL 是到达 EOL 阈值前的剩余时间或循环数。EOL 不是固定自然常数，必须写明阈值，例如容量降至额定值的 80%。","caution":"跨数据集比较时必须同时核对额定容量、温度、倍率、静置时间和 EOL 定义。","sources":[["Battery University：SOC 与 SOH","https://batteryuniversity.com/article/bu-903-how-to-measure-state-of-charge"],["Tsinghua 实车 SOH 数据论文","https://doi.org/10.1016/j.etran.2024.100361"]]},{"id":"capacity-energy","category":"基础指标","title":"容量、能量、倍率与效率计算","summary":"Ah 不是 Wh，额定能量不能只用名义电压粗略替代积分。","formula":"Q = ∫ I dt；E = ∫ V·I dt；C-rate = |I| / Qrated；ηE = Edis / Echg × 100%","body":"容量由电流对时间积分得到，能量还需要同时积分电压。1C 表示理论上一小时完成额定容量对应的电流，但实际截止时间受电压边界、温度和老化影响。","caution":"先统一 A、s、V 单位；确认充放电电流正负号；效率计算须来自同一循环边界。","sources":[["NREL Battery Lifespan 方法资源","https://www.nrel.gov/transportation/battery-lifespan.html"]]},{"id":"ica-dva","category":"诊断分析","title":"ICA / DVA 增量容量与微分电压分析","summary":"峰位和峰面积能反映反应平台变化，但求导会显著放大噪声。","formula":"ICA = dQ/dV；DVA = dV/dQ","body":"建议先分离单向充电或放电段，按等电压或等容量间隔重采样，去除重复点与异常值，再进行适度平滑和数值求导。峰位漂移、峰面积和峰高可作为退化特征。","caution":"不同温度、倍率、SOC 窗口和平滑参数下的峰不可直接比较；必须保存原始数据并报告窗口与滤波参数。","sources":[["Oxford 退化诊断论文","https://doi.org/10.1016/j.jpowsour.2016.12.121"],["ICA/DVA 方法整理（社区）","https://www.toutiao.com/article/7382388483932946954/"]]},{"id":"eis-ecm","category":"诊断分析","title":"EIS 与等效电路模型","summary":"阻抗谱是频率响应，不是单个“内阻”数值。","formula":"Z(jω) = Ṽ(jω) / Ĩ(jω)；一阶 RC 时间常数 τ = R·C","body":"Nyquist 图高频截距常与欧姆项相关，中频弧反映界面动力学，低频区受扩散影响。ECM 拟合应报告电路拓扑、频率范围、权重和拟合残差。","caution":"测量前控制 SOC、温度和静置时间；采用小信号激励；检查线缆电感、夹具接触和 Kramers–Kronig 一致性。","sources":[["Cambridge EIS 数据与论文","https://doi.org/10.1038/s41467-020-15235-7"],["Bohrium：EIS 等效电路拟合（社区教程）","https://www.bohrium.com/notebooks/55548561357"]]},{"id":"ffrls","category":"参数辨识","title":"FFRLS 在线辨识 2RC 参数","summary":"遗忘因子让递推最小二乘更重视新数据，适合缓慢时变参数。","formula":"Kₖ=Pₖ₋₁φₖ/(λ+φₖᵀPₖ₋₁φₖ)；θₖ=θₖ₋₁+Kₖ(yₖ−φₖᵀθₖ₋₁)","body":"从离散 2RC 模型构造回归向量与待辨识参数，逐采样更新参数和协方差。辨识结果还需转换回 R0、R1、C1、R2、C2，并施加物理合理性检查。","caution":"缺少持续激励时参数不可辨识；λ 过小会放大噪声，过大则跟踪慢。采样周期、参数边界和 OCV–SOC 误差都会影响结果。","sources":[["FFRLS 辨识 2RC（社区）","https://zhuanlan.zhihu.com/p/641560596"]]},{"id":"resistance","category":"基础指标","title":"直流内阻与脉冲电阻","summary":"电阻值依赖脉冲持续时间、SOC、温度与取点规则。","formula":"Rpulse = |ΔV / ΔI|","body":"在电流阶跃前后选定统一时间点，以电压变化除以电流变化得到脉冲电阻。毫秒级通常更接近欧姆项，秒级会包含极化影响。","caution":"不要把不同脉冲宽度或不同温度下的电阻直接拼接；先排除采样延迟、接触电阻和电流换向瞬态。","sources":[["Panasonic 18650PF 数据","https://data.mendeley.com/datasets/wykht8y7tg/1"]]},{"id":"model-validation","category":"数据建模","title":"SOH / RUL 建模与防止数据泄漏","summary":"按电芯划分训练与测试，不能把同一电芯的相邻循环随机打散。","formula":"MAE = mean(|ŷ−y|)；RMSE = √mean((ŷ−y)²)","body":"先按电芯、批次或实验域划分，再只用训练集拟合归一化参数和特征处理器。除平均误差外，应报告跨电芯方差、最坏样本、预测提前量和置信区间。","caution":"周期级随机划分会让模型看到同一退化轨迹的邻近点，造成严重乐观偏差。迁移学习还要明确源域与目标域是否存在样本重叠。","sources":[["HUST 深度迁移学习论文","https://doi.org/10.1039/D2EE01676A"],["BatteryML","https://github.com/microsoft/BatteryML"]]},{"id":"data-cleaning","category":"数据建模","title":"循环数据清洗检查表","summary":"先解决单位、符号、时间轴和边界，再提取健康特征。","formula":"Δt > 0；Q[k]=Q[k−1]+I[k]·Δt/3600","body":"检查时间戳单调性、重复采样、缺失段、单位、通道量程、充放电符号和循环切分。容量积分后与设备导出容量交叉核验，并保留电芯编号、温度、协议与校准信息。","caution":"不要静默删除异常循环；建立原始层、清洗层和特征层，并记录每一步规则与受影响样本数。","sources":[["BEEP 数据处理工具","https://github.com/TRI-AMDD/beep"]]},{"id":"safety","category":"实验安全","title":"过充、热失控与实验边界","summary":"滥用测试只应在具备评估、隔离与消防能力的专业设施中进行。","formula":"安全优先级：预防 > 监测 > 隔离 > 抑制 > 应急处置","body":"日常测试应遵守电芯制造商给出的电压、电流与温度边界，使用独立过压/过流/过温保护、熔断、绝缘与远程监控。异常鼓胀、异味、快速升温或电压异常时应停止测试并按实验室预案处置。","caution":"本站不提供可操作的过充或机械滥用步骤；不要在普通室内、无人监护或缺少防爆排烟设施时复现破坏性实验。","sources":[["ORNL 热失控论文","https://doi.org/10.1016/j.est.2023.106798"],["对应开放数据","https://data.mendeley.com/datasets/sn2kv34r4h/2"]]}],"resources":[{"name":"BatteryArchive","type":"数据门户","level":"官方/实验室","desc":"跨机构电池循环与破坏性测试数据检索、可视化入口。","url":"https://www.batteryarchive.org/"},{"name":"ThinkEnergy 预置数据集说明","type":"数据导航","level":"工具文档","desc":"汇总 NASA、Oxford、Severson、Attia、Cambridge 等常见数据集的结构说明。","url":"https://docs.vloong.thinkenergy.tech/en/vloong/dev_resources/preset_dataset/"},{"name":"XJTU Battery Dataset","type":"数据门户","level":"高校项目","desc":"西安交通大学电池退化数据、说明文档与相关代码入口。","url":"https://wang-fujin.github.io/"},{"name":"HNEI Battery Intelligence","type":"研究门户","level":"实验室","desc":"Hawaii Natural Energy Institute 的电池诊断与预测研究入口。","url":"https://www.hnei.hawaii.edu/battery-intelligence-diagnosis-prognosis/"},{"name":"Porsche Taycan LG E66 数据","type":"整车电芯","level":"数据仓库","desc":"面向高功率汽车电芯性能分析的 Borealis 数据页面。","url":"https://borealisdata.ca/dataset.xhtml?persistentId=doi:10.5683/SP3/7JP3NM"},{"name":"Battery-Timer","type":"代码","level":"开源项目","desc":"电池容量退化基础模型、公开训练数据索引与复现代码。","url":"https://github.com/sjtu-chan-joey/Battery-Timer"},{"name":"Bohrium EIS/ECM 教程","type":"方法教程","level":"社区资料","desc":"EIS 数据导入、等效电路选择与参数拟合的中文入门页面。","url":"https://www.bohrium.com/notebooks/55548561357"},{"name":"ST-EVCDP 城市电动车充电数据","type":"代码与数据","level":"开源项目","desc":"城市电动车充电需求时空研究数据集与代码入口。","url":"https://gitcode.com/gh_mirrors/st/ST-EVCDP/"},{"name":"ICA / DVA 方法导读","type":"延伸阅读","level":"社区资料","desc":"用于快速理解增量容量和微分电压分析；结论请回到原始论文核对。","url":"https://www.toutiao.com/article/7382388483932946954/"},{"name":"SOC / SOH / SOE / RUL 概念导读","type":"延伸阅读","level":"社区资料","desc":"中文概念梳理入口，适合作为入门导航，不作为核心引用来源。","url":"https://zhuanlan.zhihu.com/p/654057312"}],"libraryPapers":[{"title":"On state-of-charge determination for lithium-ion batteries","authors":"Z. Li, J. Huang, B. Y. Liaw, J. Zhang","journal":"Journal of Power Sources","year":2017,"doi":"10.1016/j.jpowsour.2017.03.001","url":"https://doi.org/10.1016/j.jpowsour.2017.03.001","keywords":["SOC","综述","电池模型"],"kind":"基础综述","summary":"从热力学定义、Ah 积分、模型回归和不确定性角度讨论 SOC 的定义与验证。"},{"title":"Review on state of charge estimation techniques of lithium-ion batteries: A control-oriented approach","authors":"O. Demirci et al.","journal":"Journal of Energy Storage","year":2023,"doi":"10.1016/j.est.2023.108707","url":"https://doi.org/10.1016/j.est.2023.108707","keywords":["SOC","BMS","综述"],"kind":"方法综述","summary":"按开环、闭环与混合方法梳理 SOC 估计，强调精度、鲁棒性和实现复杂度。"},{"title":"Data-driven state of charge estimation of lithium-ion batteries: Algorithms, implementation factors, limitations and future trends","authors":"M. S. H. Lipu et al.","journal":"Journal of Cleaner Production","year":2020,"doi":"10.1016/j.jclepro.2020.124110","url":"https://doi.org/10.1016/j.jclepro.2020.124110","keywords":["SOC","机器学习","深度学习","综述"],"kind":"方法综述","summary":"总结数据驱动 SOC 估计的输入、预处理、超参数、计算成本与鲁棒性验证。"},{"title":"Recent advancement of remaining useful life prediction of lithium-ion battery in electric vehicle applications","authors":"M. S. H. Lipu et al.","journal":"Energy Reports","year":2024,"doi":"10.1016/j.egyr.2024.04.039","url":"https://doi.org/10.1016/j.egyr.2024.04.039","keywords":["RUL","寿命预测","机器学习","综述"],"kind":"方法综述","summary":"比较 RUL 建模机制、网络结构、数据预处理、评价指标和工程实现难点。"},{"title":"Predict the lifetime of lithium-ion batteries using early cycles: A review","authors":"Y. Ma et al.","journal":"Applied Energy","year":2024,"doi":"10.1016/j.apenergy.2024.124171","url":"https://doi.org/10.1016/j.apenergy.2024.124171","keywords":["RUL","早期预测","退化机理","综述"],"kind":"前沿综述","summary":"聚焦利用早期循环预测寿命，比较机理、经验、数据驱动和融合方法。"},{"title":"Challenges and opportunities towards fast-charging battery materials","authors":"Y. Liu, Y. Zhu, Y. Cui","journal":"Nature Energy","year":2019,"doi":"10.1038/s41560-019-0405-3","url":"https://doi.org/10.1038/s41560-019-0405-3","keywords":["快充","材料","锂析出","综述"],"kind":"基础综述","summary":"从传质、界面电荷转移、热管理和材料表征讨论极快充的限制。"},{"title":"Fast charging of energy-dense lithium-ion batteries","authors":"C.-Y. Wang et al.","journal":"Nature","year":2022,"doi":"10.1038/s41586-022-05281-0","url":"https://doi.org/10.1038/s41586-022-05281-0","keywords":["快充","热管理","电解液"],"kind":"研究论文","summary":"结合非对称温度调制与双盐电解液，研究高能量密度电芯的快速充电。"},{"title":"Differential Analysis of Galvanostatic Cycle Data from Li-Ion Batteries: Interpretative Insights and Graphical Heuristics","authors":"J. Z. Olson, C. M. López, E. J. F. Dickinson","journal":"Chemistry of Materials","year":2023,"doi":"10.1021/acs.chemmater.2c01976","url":"https://doi.org/10.1021/acs.chemmater.2c01976","keywords":["ICA/DVA","退化诊断","机理"],"kind":"方法论文","summary":"系统解释 dQ/dV 与 dV/dQ 峰的物理含义、全电池映射和图形判读注意事项。"},{"title":"State of charge estimation of lithium batteries: Review for equivalent circuit model methods","authors":"Z. Tao et al.","journal":"Measurement","year":2024,"doi":"10.1016/j.measurement.2024.115148","url":"https://doi.org/10.1016/j.measurement.2024.115148","keywords":["SOC","等效电路","参数辨识","综述"],"kind":"方法综述","summary":"比较 RINT、Thevenin、双极化、PNGV 等模型及其参数辨识和动态测试方法。"},{"title":"A systematic review of electrochemical model-based lithium-ion battery state estimation in battery management systems","authors":"F. Guo et al.","journal":"Journal of rty battery data collection; original data files and licence not individually checked. No paper listed in source index.","task":"SOH / EIS","cells":"8 Aspilsan INR18650 cells","conditions":"Up to 1150 cycles; ICI and EIS measured every 50 cycles","size":"3.8 GB (Zenodo listed file)"},"hkust-fewshot-firstcycle":{"cn":"First-cycle few-shot battery lifetime abnormality data","description":"Indexed in a third-party battery data collection; original data files and licence not individually checked. The source directory lists a paper title; exact dataset-paper relationship requires verification.","task":"RUL","cells":"Not independently checked","conditions":"Not independently checked","size":"Not independently checked"},"tsinghua-early-decoupling":{"cn":"Early degradation-pattern decoupling battery data (Tsinghua)","description":"Indexed in a third-party battery data collection; original data files and licence not individually checked. The source directory lists a paper title; exact dataset-paper relationship requires verification.","task":"SOH / RUL","cells":"Not independently checked","conditions":"Not independently checked","size":"Not independently checked"},"pavia-calb-l148n58a":{"cn":"CALB L148N58A prismatic battery characterization and drive cycles","description":"Indexed in a third-party battery data collection; original data files and licence not individually checked. The source directory lists a paper title; exact dataset-paper relationship requires verification.","task":"SOC / EIS / MODEL","cells":"11 prismatic 58 Ah battery cells","conditions":"10/25/40 C; HPPC; EIS; WLTP, UDDS and US06","size":"Not independently checked"},"hkust-batterylife-processed-v11":{"cn":"BatteryLife Processed v11 - life prediction benchmark","description":"Indexed in a third-party battery data collection; original data files and licence not individually checked. The source directory lists a paper title; exact dataset-paper relationship requires verification. Newer processed benchmark v12: https://zenodo.org/records/21149533.","task":"RUL","cells":"Not independently checked","conditions":"Processed multi-source battery life benchmark, v11; consult v12 for current release","size":"30.9 GB (v11 repository listing)"},"cmu-evtol-duty-cycle":{"cn":"eVTOL battery duty-cycle dataset (Carnegie Mellon)","description":"Indexed in a third-party battery data collection; original data files and licence not individually checked. The source directory lists a paper title; exact dataset-paper relationship requires verification.","task":"MODEL / RUL","cells":"22 cells / 21,392 cycling tests","conditions":"eVTOL takeoff, cruise, and landing discharge profiles","size":"Not independently checked"}},"tools":{"PyBaMM":{"type":"Electrochemical modelling","desc":"Open-source Python framework for battery mathematics with DFN, SPM, SPMe and thermal models."},"BEEP":{"type":"Data processing","desc":"TRI toolkit for parsing, structuring and featurizing cycling data and building early-life predictions."},"BatteryML":{"type":"Machine-learning benchmark","desc":"Data preprocessing, feature engineering and model evaluation toolbox for battery lifetime prediction."},"batteryDAT":{"type":"Data analysis","desc":"Imperial College Python package for loading, cleaning and analysing battery cycling and degradation data."},"COMSOL":{"type":"Multiphysics simulation","desc":"Commercial finite-element platform for coupled battery thermal, electrochemical and structural problems."},"MATLAB / Simulink":{"type":"System-level modelling","desc":"Modelling and validation environment for equivalent circuits, BMS algorithms and system-level control."},"Battery-Timer":{"type":"Battery foundation model","desc":"Open-source foundation model for capacity degradation prediction, with public training-data links and reproduction notes."}},"resources":{"BatteryArchive":{"type":"Data portal","level":"Official / laboratory","desc":"Cross-institution search and visualization for battery cycling and destructive-test data."},"ThinkEnergy 预置数据集说明":{"name":"ThinkEnergy Preset Dataset Guide","type":"Data guide","level":"Tool documentation","desc":"Structure notes for common NASA, Oxford, Severson, Attia and Cambridge datasets."},"XJTU Battery Dataset":{"type":"Data portal","level":"University project","desc":"XJTU battery degradation data, documentation and associated code."},"HNEI Battery Intelligence":{"type":"Research portal","level":"Laboratory","desc":"Hawaii Natural Energy Institute research on battery diagnostics and prognostics."},"Porsche Taycan LG E66 数据":{"name":"Porsche Taycan LG E66 Data","type":"Automotive cell data","level":"Data repository","desc":"Borealis dataset for analysing high-power automotive-cell performance."},"Battery-Timer":{"type":"Code","level":"Open-source project","desc":"Battery capacity-degradation foundation model, public training-data index and reproduction code."},"Bohrium EIS/ECM 教程":{"name":"Bohrium EIS/ECM Tutorial","type":"Methods tutorial","level":"Community resource","desc":"Chinese introduction to EIS import, equivalent-circuit selection and parameter fitting."},"ST-EVCDP 城市电动车充电数据":{"name":"ST-EVCDP Urban EV Charging Data","type":"Code and data","level":"Open-source project","desc":"Dataset and code for spatiotemporal studies of urban EV charging demand."},"ICA / DVA 方法导读":{"name":"ICA / DVA Method Guide","type":"Further reading","level":"Community resource","desc":"A quick introduction to incremental-capacity and differential-voltage analysis; verify conclusions against primary papers."},"SOC / SOH / SOE / RUL 概念导读":{"name":"SOC / SOH / SOE / RUL Concept Guide","type":"Further reading","level":"Community resource","desc":"Chinese concept guide for orientation, not a primary citation source."}},"knowledge":{"states":{"category":"Fundamentals","title":"SOC, SOH, SOE, RUL and EOL","summary":"Comparable model results begin with consistent definitions.","body":"SOC is the fraction of currently available capacity. SOH is commonly expressed relative to a capacity or resistance baseline. SOE accounts for voltage when describing remaining energy. RUL is the remaining time or cycles before an EOL threshold. EOL is not a universal constant: always state the threshold, such as 80% of rated capacity.","caution":"For cross-dataset comparisons, verify rated capacity, temperature, C-rate, rest time and the EOL definition.","sources":["Battery University: SOC and SOH","Tsinghua field SOH paper"]},"capacity-energy":{"category":"Fundamentals","title":"Capacity, energy, C-rate and efficiency","summary":"Ah is not Wh, and nominal voltage is not a substitute for energy integration.","body":"Capacity is the time integral of current; energy also requires voltage. A 1C current nominally transfers rated capacity in one hour, but actual cutoff time depends on voltage limits, temperature and aging.","caution":"Normalize A, s and V units first; confirm current-sign convention; calculate efficiency over matching cycle boundaries.","sources":["NREL Battery Lifespan resources"]},"ica-dva":{"category":"Diagnostics","title":"ICA / DVA incremental-capacity and differential-voltage analysis","summary":"Peak position and area reveal plateau changes, but differentiation strongly amplifies noise.","body":"Separate a monotonic charge or discharge segment, resample on uniform voltage or capacity, remove duplicates and outliers, then smooth moderately before numerical differentiation. Peak shift, area and height can become degradation features.","caution":"Do not directly compare peaks across different temperature, rate, SOC window or smoothing settings. Preserve raw data and report window and filter parameters.","sources":["Oxford degradation diagnostics paper","ICA/DVA methods guide (community)"]},"eis-ecm":{"category":"Diagnostics","title":"EIS and equivalent-circuit models","summary":"An impedance spectrum is a frequency response, not one “internal resistance” value.","formula":"Z(jω) = Ṽ(jω) / Ĩ(jω); first-order RC time constant τ = R·C","body":"The high-frequency Nyquist intercept is often linked to ohmic terms, the mid-frequency arc to interface kinetics and the low-frequency region to diffusion. Report circuit topology, frequency range, weighting and residuals for ECM fitting.","caution":"Control SOC, temperature and rest time; use small-signal excitation; check cable inductance, fixture contact and Kramers–Kronig consistency.","sources":["Cambridge EIS data and paper","Bohrium: EIS equivalent-circuit fitting (community)"]},"ffrls":{"category":"Parameter identification","title":"Online 2RC identification with FFRLS","summary":"A forgetting factor gives recursive least squares more weight on recent data, helping track slowly varying parameters.","body":"Build the regression vector and unknowns from a discrete 2RC model, then update the parameters and covariance at each sample. Convert the identified values back to R0, R1, C1, R2 and C2 and enforce physical plausibility checks.","caution":"Parameters are unidentifiable without persistent excitation. A small λ amplifies noise; a large λ tracks slowly. Sampling interval, bounds and OCV–SOC error also matter.","sources":["FFRLS 2RC identification guide (community)"]},"resistance":{"category":"Fundamentals","title":"DC internal resistance and pulse resistance","summary":"Resistance depends on pulse duration, SOC, temperature and the sampling rule.","body":"Choose a consistent time before and after a current step, then divide voltage change by current change. Millisecond values are closer to the ohmic term; longer pulses include polarization.","caution":"Do not merge resistance values from different pulse widths or temperatures. First exclude sampling delay, contact resistance and current-reversal transients.","sources":["Panasonic 18650PF data"]},"model-validation":{"category":"Data modelling","title":"SOH / RUL modelling without data leakage","summary":"Split by cell, not by randomly shuffling neighbouring cycles from the same cell.","body":"Split by cell, batch or experimental domain before fitting normalization and feature processors on training data only. Report cross-cell variance, worst cases, prediction horizon and confidence intervals in addition to mean error.","caution":"Cycle-level random splits expose neighbouring points from one degradation trajectory and create serious optimistic bias. Transfer learning must also document source–target overlap.","sources":["HUST deep transfer-learning paper","BatteryML"]},"data-cleaning":{"category":"Data modelling","title":"Cycling-data cleaning checklist","summary":"Resolve units, signs, time axes and boundaries before extracting health features.","body":"Check timestamp monotonicity, duplicates, missing segments, units, channel ranges, current signs and cycle boundaries. Cross-check integrated capacity against tester exports and retain cell ID, temperature, protocol and calibration metadata.","caution":"Never silently delete abnormal cycles. Keep raw, cleaned and feature layers, and record every rule and affected sample count.","sources":["BEEP data-processing toolkit"]},"safety":{"category":"Experimental safety","title":"Overcharge, thermal runaway and experimental boundaries","summary":"Abuse testing belongs only in professional facilities with risk assessment, isolation and fire control.","formula":"Safety priority: prevention > monitoring > isolation > suppression > emergency response","body":"Routine tests must stay within manufacturer voltage, current and temperature limits and use independent over-voltage, over-current and over-temperature protection, fusing, insulation and remote monitoring. Stop on swelling, odour, rapid heating or abnormal voltage and follow the laboratory emergency plan.","caution":"This site does not provide operational overcharge or mechanical-abuse steps. Never reproduce destructive tests indoors without supervision, explosion protection and exhaust facilities.","sources":["ORNL thermal-runaway paper","Associated open data"]}},"paper":{"10.1016/j.jpowsour.2017.03.001":{"summary":"A foundational review of SOC definitions, measurement methods and model-based estimation for lithium-ion batteries."},"10.1016/j.est.2023.108707":{"summary":"Reviews control-oriented SOC estimators and their trade-offs for real-time battery management."},"10.1016/j.jclepro.2020.124110":{"summary":"Surveys data-driven SOC estimation, input features, model choices and generalization challenges."},"10.1016/j.egyr.2024.04.039":{"summary":"Reviews data-driven remaining-useful-life methods, evaluation metrics and open challenges."},"10.1016/j.apenergy.2024.124171":{"summary":"Summarizes early-life battery prediction methods, usable signals and cross-condition validation issues."},"10.1038/s41560-019-0405-3":{"summary":"Reviews materials and interfacial limits that govern fast charging and lithium plating."},"10.1038/s41586-022-05281-0":{"summary":"Demonstrates fast charging of energy-dense cells while controlling plating and degradation."},"10.1021/acs.chemmater.2c01976":{"summary":"Reviews differential voltage and incremental capacity analysis for identifying battery degradation modes."},"10.1016/j.measurement.2024.115148":{"summary":"Reviews equivalent-circuit structures, parameter identification and validation for lithium-ion batteries."},"10.1016/j.est.2024.113850":{"summary":"Reviews electrochemical-model simplification, parameterization and joint state estimation in BMS applications."},"10.1016/j.nxener.2024.100186":{"summary":"Reviews thermal-runaway triggers, evolution, prevention and safety research from materials to cell structure."},"10.1016/j.ensm.2024.103417":{"summary":"Reviews thermal-runaway modelling from particles and cells to modules and systems, including scale coupling."},"10.1016/j.jtte.2024.09.004":{"summary":"Maps research trends across aging mechanisms, SOH estimation and RUL prediction."},"10.5334/jors.309":{"summary":"Introduces the modular open-source PyBaMM framework and its numerical battery-modelling workflow."},"10.1126/sciadv.aas9820":{"summary":"Reviews material strategies for safer electrodes, electrolytes, separators and cell architectures."}},"keyword":{"寿命预测":"Lifetime prediction","快充":"Fast charging","等效电路":"Equivalent circuit","电化学模型":"Electrochemical model","机器学习":"Machine learning","热失控":"Thermal runaway","安全":"Safety","二次寿命":"Second life","数据集配对":"Dataset paired","状态估计":"State estimation","综述":"Review","材料":"Materials","多物理场":"Multiphysics","仿真":"Simulation","开源工具":"Open-source tool","BMS":"BMS","容量估计":"Capacity estimation","随机工况建模":"Random-duty modelling","早期寿命预测":"Early lifetime prediction","快充优化":"Fast-charging optimization","长期退化":"Long-term degradation","实际工况退化":"Real-world duty degradation","EIS 诊断":"EIS diagnostics","轨迹预测":"Trajectory prediction","退化机理分析":"Degradation mechanism analysis","硅负极退化":"Silicon-anode degradation","跨设计寿命预测":"Cross-design lifetime prediction","SOH / 迁移学习":"SOH / transfer learning","SOC 估计":"SOC estimation","实车 SOH 估计":"Field SOH estimation","热失控安全":"Thermal-runaway safety","SOC / 迁移学习":"SOC / transfer learning","二次寿命评估":"Second-life assessment","跨体系退化建模":"Cross-chemistry degradation modelling","电池模型":"Battery model","深度学习":"Deep learning","早期预测":"Early prediction","退化机理":"Degradation mechanisms","锂析出":"Lithium plating","析锂":"Lithium plating","热管理":"Thermal management","电解液":"Electrolyte","退化诊断":"Degradation diagnostics","机理":"Mechanisms","参数辨识":"Parameter identification","实车数据":"Field data","基础模型":"Foundational model","传播":"Propagation","经济性":"Economics","循环经济":"Circular economy","生命周期评价":"Life-cycle assessment","储能":"Energy storage"},"kind":{"数据配对":"Dataset paper","研究论文":"Research paper","系统综述":"Systematic review","方法综述":"Methods review","建模综述":"Modelling review","安全综述":"Safety review","计量综述":"Bibliometric review","软件论文":"Software paper","基础综述":"Foundational review","材料综述":"Materials review","方法论文":"Methods paper","应用研究":"Applied study","模型论文":"Modelling paper","实验研究":"Experimental study","前沿综述":" function replaceText(node,map){const raw=node.nodeValue,trim=raw.trim(),next=map[trim];if(!next)return;node.nodeValue=raw.replace(trim,next)}
function translateStaticUI(){
  const map=enMode()?UI_EN:UI_ZH,walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>/^(SCRIPT|STYLE)$/.test(n.parentElement?.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  while(walker.nextNode())replaceText(walker.currentNode,map);
  document.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>['placeholder','aria-label','title'].forEach(attr=>{const value=el.getAttribute(attr);if(value&&map[value])el.setAttribute(attr,map[value])}));
  document.title=enMode()?'Open Battery Data Platform':'电池开放数据平台';
  document.querySelector('meta[name="description"]')?.setAttribute('content',enMode()?'A public battery dataset, paper and modelling-tool index for researchers and engineers.':'面向电池科研与工程人员的公开数据集、论文和仿真工具索引平台。');
}

const readList = key => { try { const v=JSON.parse(BatteryStore.getItem(key) || '[]'); return Array.isArray(v)?v:[]; } catch { return []; } };

const optionList = (values, allLabel) => `<option value="">${allLabel}</option>${values.map(v => `<option value="${v}">${v}</option>`).join('')}`;
const escapeCsv = value => `"${String(value ?? '').replaceAll('"','""')}"`;
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const normalizeDoi = value => String(value||'').trim().replace(/^https?:\/\/(?:dx\.)?doi\.org\//i,'');
const parseTags = value => [...new Set(String(value||'').split(/[,，;；]/).map(tag=>tag.trim()).filter(Boolean))].slice(0,12);
const isHttpUrl = value => {try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)}catch{return false}};
const allPapers = () => {const key=window.BATTERY_MODEL.canonical;const merged=new Map(papers.map(p=>[key(p),p]));for(const p of state.userPapers){const original=merged.get(key(p));merged.set(key(p),original?{...original,...p,datasetLinks:original.datasetLinks||[],keywords:[...new Set([...(original.keywords||[]),...(p.keywords||[])])]}:p);}return [...merged.values()];};
function persistUserPapers(){BatteryStore.setItem('advbattery:userPapers',JSON.stringify(state.userPapers))}
function normalizeUserPaper(raw,id){
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
  const item={id:id||String(raw.id||`user-${Date.now()}-${Math.random().toString(36).slice(2,8)}`),title:String(raw.title||'').trim(),authors:String(raw.authors||'').trim(),journal:String(raw.journal||'').trim(),year:Number(raw.year),kind:String(raw.kind||'').trim(),doi:normalizeDoi(raw.doi),url:String(raw.url||'').trim(),summary:String(raw.summary||'').trim(),keywords:Array.isArray(raw.keywords)?parseTags(raw.keywords.join(',')):parseTags(raw.keywords),userAdded:true,updatedAt:new Date().toISOString()};
  return item.title&&item.authors&&item.journal&&Number.isInteger(item.year)&&item.year>=1900&&item.year<=2100&&item.kind&&isHttpUrl(item.url)&&item.summary&&item.keywords.length?item:null;
}
state.userPapers=state.userPapers.map(item=>normalizeUserPaper(item,item?.id)).filter(Boolean);
const citationText = d => d.paper ? `${d.paper.authors} (${d.paper.year}). ${d.paper.title}. ${d.paper.journal}. ${d.paper.doi ? `https://doi.org/${d.paper.doi}` : d.paper.url}` : `${d.institution} (${d.year}). ${d.title}. ${d.source}`;

function card(d){
  const view=localDataset(d);
  const saved=state.saved.has(d.id), compared=state.compare.has(d.id);
  return `<article class="dataset-card reveal">
    <a class="card-main" href="#/dataset/${d.id}"><span class="card-kicker">${view.task} · ${d.year}</span><h2>${view.cn}</h2><p class="institution">${d.institution}</p><p class="desc">${view.description}</p><div class="card-meta"><span>${d.chemistry}</span>${d.formats.map(f=>`<span>${f}</span>`).join('')}<span>${d.license}</span></div></a>
    <div class="card-actions"><button class="save-button ${saved?'selected':''}" data-save="${d.id}" type="button" aria-label="${enMode()?(saved?'Remove from saved':'Save'):(saved?'取消收藏':'收藏')} ${view.cn}">${saved?(enMode()?'★ Saved':'★ 已收藏'):(enMode()?'☆ Save':'☆ 收藏')}</button><button class="compare-button ${compared?'selected':''}" data-compare="${d.id}" type="button">${compared?(enMode()?'✓ Added':'✓ 已加入'):(enMode()?'＋ Compare':'＋ 对比')}</button></div>
  </article>`;
}
function bindDatasetActions(container, refresh){
  container.addEventListener('click',event=>{
    const save=event.target.closest('[data-save]'), compare=event.target.closest('[data-compare]');
    if(save){ const id=save.dataset.save;state.saved.has(id)?state.saved.delete(id):state.saved.add(id);persist();notify(state.saved.has(id)?(enMode()?'Saved':'已加入收藏'):(enMode()?'Removed from saved':'已取消收藏'));refresh?.(); }
    if(compare){ const id=compare.dataset.compare;if(state.compare.has(id))state.compare.delete(id);else if(state.compare.size>=3){notify(enMode()?'You can compare up to 3 datasets':'最多同时对比 3 个数据集');return}else state.compare.add(id);persist();notify(state.compare.has(id)?(enMode()?'Added to comparison':'已加入对比'):(enMode()?'Removed from comparison':'已移出对比'));refresh?.(); }
  });
}

  document.querySelector('#institution-total').textContent=String(new Set(datasets.map(d=>d.institution)).size).padStart(2,'0');

}

  const params=new URLSearchParams(location.hash.split('?')[1]||'');
  chemistry.value=params.get('chemistry')||'';format.value=params.get('format')||'';task.value=params.get('task')||'';license.value=params.get('license')||'';saved.checked=params.get('saved')==='1';search.value=params.get('q')||'';sort.value=params.get('sort')||'featured';
  let visible=[];

function filtersFromURL(){const p=new URLSearchParams(location.hash.split('?')[1]||'');const f={q:p.get('q')||'',license:p.get('license')||'',saved:p.get('saved')==='1',field:p.get('field')||'',fieldStatus:p.get('fieldStatus')||'present',count:p.get('count')||'',temp:p.get('temp')||'',sort:p.get('sort')||'featured',view:p.get('view')||Store.getItem('advbattery:view')||'list',page:Math.max(1,parseInt(p.get('page'))||1),size:[12,24,48].includes(Number(p.get('size')))?Number(p.get('size')):12};for(const k of filterArrays)f[k]=(p.get(k)||'').split(',').filter(Boolean);if(!['list','card','table'].includes(f.view))f.view='list';return f;}
function matches(d,f,omit){const v=localDataset(d);const hay=[d.title,d.cn,v.cn,d.institution,d.task,d.description,v.description,d.conditions,d.chemistry,d.datasetDoi,d.paper?.title,d.paper?.doi,d.paper?.authors,...d.meta.tasks,...d.meta.cathodes,...d.formats,d.meta.cathodes.includes('NMC')?'NCM':''].join(' ').toLowerCase();const tokens=f.q.toLowerCase().trim().split(/\s+/).filter(Boolean);if(!tokens.every(t=>hay.includes(t)))return false;const values={task:d.meta.tasks,chemistry:d.meta.cathodes,format:d.formats,type:[d.meta.resourceType],access:[d.meta.access]};for(const k of filterArrays){if(k!==omit&&f[k].length&&!f[k].some(x=>values[k].includes(x)))return false;}if(f.saved&&!state.saved.has(d.id))return false;if(f.license&&(f.license==='open'?!isOpen(d):isOpen(d)))return false;if(f.field){const value=d.meta.fields[f.field]||'unknown';if(value!==f.fieldStatus)return false;}if(f.count&&!(d.meta.cellCount>=Number(f.count)))return false;if(f.temp){const n=Number(f.temp);if(!d.meta.temperature||!d.meta.temperature.includes(n))return false;}return true;}

renderCompare=()=>{

function paperKey(p){return window.BATTERY_MODEL.canonical(p);}
function citation(p){return `${p.authors} (${p.year}). ${p.title}. ${p.journal}. ${p.doi?'https://doi.org/'+p.doi:p.url}`;}
function exportAuthors(p){const s=String(p.authors||'').trim();const names=/;|\s+and\s+/.test(s)?s.split(/;\s*|\s+and\s+/):s.split(/,\s*/);return names.map(x=>x.trim()).filter(Boolean);}
function bibText(p){const e=x=>String(x||'').replaceAll('\\','\\textbackslash{}').replaceAll('{','\\{').replaceAll('}','\\}').replace(/[%&#_$]/g,m=>'\\'+m);const key=(p.authors.split(/[ ,]/)[0]||'battery').replace(/[^a-z0-9]/gi,'')+p.year+'_'+(p.doi||p.title).replace(/[^a-z0-9]/gi,'').slice(-10);const authors=exportAuthors(p).map(a=>a.replace(/\s+et al\.?$/i,' and others')).join(' and ');return `@${p.type==='dataset_record'?'misc':'article'}{${key},\n  title = {${e(p.title)}},\n  author = {${e(authors)}},\n  year = {${p.year}},\n  ${p.type==='dataset_record'?'publisher':'journal'} = {${e(p.journal)}},\n${p.doi?'  doi = {'+e(p.doi)+'},\n':''}  url = {${e(p.url)}}\n}`;}
function risText(p){const clean=x=>String(x||'').replace(/[\r\n]+/g,' ');return [`TY  - ${p.type==='dataset_record'?'DATA':'JOUR'}`,`TI  - ${clean(p.title)}`,...exportAuthors(p).map(a=>'AU  - '+clean(a)),`PY  - ${p.year}`,`JO  - ${clean(p.journal)}`,p.doi?'DO  - '+clean(p.doi):'',`UR  - ${clean(p.url)}`,'ER  -'].filter(Boolean).join('\r\n');}
function findPaper(key){return allPapers().find(p=>paperKey(p)===key);}
paperRow=p=>{

utton class="quiet-button" data-cite-key="${H(key)}" data-cite-format="bib">BibTeX</button><button class="quiet-button" data-cite-key="${H(key)}" data-cite-format="ris">RIS</button>${p.userAdded?`<button class="quiet-button" data-edit-paper="${H(p.id)}">${L('\u7f16\u8f91','Edit')}</button><button class="text-button danger" data-delete-paper="${H(p.id)}">${L('\u5220\u9664','Delete')}</button>`:''}</div></div></article>`;
};

function paperNote(key){const p=findPaper(key);if(!p)return;const n=space.paperNotes[key]||{};const dialog=openDialog(L('\u9605\u8bfb\u7b14\u8bb0','Reading notes'),`<h3>${H(p.title)}</h3><form id="paper-note-form" class="note-form"><label>${L('\u9605\u8bfb\u8fdb\u5ea6','Reading progress')}<select name="status">${['unread','reading','read'].map(s=>option(s,statusLabel(s),n.status||'unread')).join('')}</select></label><label>${L('\u65b9\u6cd5\u3001\u5b9e\u9a8c\u4e0e\u542f\u53d1','Methods, experiments & ideas')}<textarea name="text" maxlength="20000" rows="7">${H(n.text||'')}</textarea></label><button type="submit" class="button button-primary">${L('\u4fdd\u5b58\u7b14\u8bb0','Save notes')}</button></form>`);$('#paper-note-form',dialog).addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));space.paperNotes[key]={text:v.text,status:v.status,saved:true,updatedAt:now()};saveSpace();closeDialog();window.wbRefresh?.();notify(L('\u5df2\u4fdd\u5b58\u9605\u8bfb\u8bb0\u5f55','Reading record saved'));});}

  content.innerHTML=`<section class="panel backup-panel"><p class="eyebrow">EXPORT / RESTORE</p><h2>${L('\u4e3a\u79d1\u7814\u8bb0\u5f55\u7559\u4e00\u4efd\u526f\u672c','Keep a copy of your research workspace')}</h2><p>${L('\u4e00\u4e2a JSON \u6587\u4ef6\u5305\u542b\u6570\u636e\u6536\u85cf\u3001\u5206\u7ec4\u3001\u7b14\u8bb0\u3001\u4e2a\u4eba\u6587\u732e\u3001\u9605\u8bfb\u72b6\u6001\u3001\u6700\u8fd1\u6d4f\u89c8\u548c\u663e\u793a\u8bbe\u7f6e\u3002','One JSON file contains saved datasets, collections, notes, personal papers, reading progress, recent visits and display settings.')}</p><div class="backup-stats"><span><b>${state.saved.size}</b>${L('\u6536\u85cf\u6570\u636e','Saved datasets')}</span><span><b>${Object.keys(space.datasetNotes).length+Object.keys(space.paperNotes).length}</b>${L('\u7b14\u8bb0 / \u9605\u8bfb\u8bb0\u5f55','Note / reading records')}</span><span><b>${state.userPapers.length}</b>${L('\u4e2a\u4eba\u6587\u732e','Personal papers')}</span></div><div class="action-row"><button class="button button-primary" data-backup>${L('\u5bfc\u51fa\u5b8c\u6574\u5907\u4efd','Export full backup')} &#8595;</button><button class="button button-secondary" data-import>${L('\u9009\u62e9\u5907\u4efd\u5e76\u9884\u89c8','Choose backup & preview')} &#8593;</button></div><p class="small muted">${L('\u5bfc\u5165\u524d\u663e\u793a\u6761\u76ee\u6570\u4e0e\u51b2\u7a81\u4fe1\u606f\uff0c\u786e\u8ba4\u540e\u624d\u5408\u5e76\uff1b\u4e0d\u4f1a\u81ea\u52a8\u6e05\u7a7a\u539f\u6709\u8bb0\u5f55\u3002','Preview counts and conflicts before confirming a merge. Existing records are never automatically cleared.')}</p></section><section class="panel"><h2>${L('\u542f\u52a8\u4e0e\u4f7f\u7528\u504f\u597d','Startup preference')}</h2><label class="settings-label">${L('\u6253\u5f00\u9996\u9875\u65f6\u9ed8\u8ba4\u8fdb\u5165','When opened without a route')}<select id="startup-setting">${option('home',L('\u5de5\u4f5c\u53f0\u9996\u9875','Workbench home'),Store.getItem('advbattery:startup')||'home')}${option('datasets',L('\u6570\u636e\u96c6\u76ee\u5f55','Dataset library'),Store.getItem('advbattery:startup')||'home')}</select></label><p class="small muted">${L('\u4e3b\u9898\u3001\u8bed\u8a00\u548c\u5b57\u53f7\u53ef\u5728\u53f3\u4e0a\u89d2\u201c\u663e\u793a\u8bbe\u7f6e\u201d\u8c03\u6574\u3002','Use Display in the top-right corner for theme, language and text size.')}</p></section><section class="panel"><h2>${L('\u4ece\u65e7\u7248\u8fc1\u79fb','Moving from the previous version')}</h2><p>${L('\u540c\u4e00\u6d4f\u89c8\u5668\u3001\u540c\u4e00\u7f51\u7ad9\u5730\u5740\u4e0b\u81ea\u52a8\u8bfb\u53d6\u65e7\u7248\u6536\u85cf\u548c\u4e2a\u4eba\u6587\u732e\u3002\u4e0d\u540c\u8def\u5f84\u6216\u8bbe\u5907\u4e0b\uff0c\u8bf7\u4f7f\u7528\u5bfc\u51fa / \u5bfc\u5165\u3002','Existing saved datasets and personal papers are read on the same browser origin. Use export/import when moving paths or devices.')}</p><p>${L('\u63a8\u8350\u5728\u56fa\u5b9a\u5730\u5740\u4f7f\u7528\u672c\u5730\u9759\u6001\u670d\u52a1\u5668\u3002\u76f4\u63a5\u53cc\u51fb HTML \u4ecd\u53ef\u4f7f\u7528\uff0c\u4f46\u4e0d\u5e94\u628a\u6d4f\u89c8\u5668\u5b58\u50a8\u4f5c\u4e3a\u552f\u4e00\u526f\u672c\u3002','A local static server at a stable address is recommended. Double-clicking HTML still works, but browser storage should not be your only copy.')}</p><code>python -m http.server 8080 --bind 127.0.0.1</code></section>`;
  $('#startup-setting').addEventListener('change',e=>{Store.setItem('advbattery:startup',e.target.value);notify(L('\u542f\u52a8\u504f\u597d\u5df2\u4fdd\u5b58','Startup preference saved'));});
 }
 window.wbRefresh=renderWorkspace;setActive('workspace');
}
function refreshActionButtons(){
 $$('[data-save]').forEach(b=>{const yes=state.saved.has(b.dataset.save);b.setAttribute('aria-pressed',String(yes));b.classList.toggle('is-active',yes);b.innerHTML=(yes?'&#9733;':'&#9734;')+' '+L('\u6536\u85cf','Save');});
 $$('[data-compare]').forEach(b=>{const yes=state.compare.has(b.dataset.compare);b.setAttribute('aria-pressed',String(yes));b.classList.toggle('is-active',yes);b.innerHTML=(yes?'&#10003;':'+')+' '+L('\u5bf9\u6bd4','Compare');});
}
document.addEventListener('click',e=>{
 const el=e.target.closest('button,a');if(!el)return;
 if(el.matches('a[href="#app"]')){e.preventDefault();app.focus();return;}
 if(el.matches('a[href^="#/"]')){scrolls[currentHash]=window.scrollY;saveBrowse();if($('#workbench-dialog'))closeDialog();$('#display-settings')?.removeAttribute('open');nav.classList.remove('open');menuButton.setAttribute('aria-expanded','false');}
 if(el.dataset.save){const id=el.dataset.save;if(!validIds.has(id))return;state.saved.has(id)?state.saved.delete(id):state.saved.add(id);persist();refreshActionButtons();if(!$('#workbench-dialog'))window.wbRefresh?.();notify(state.saved.has(id)?L('\u5df2\u6536\u85cf','Saved'):L('\u5df2\u53d6\u6d88\u6536\u85cf\uff08\u7b14\u8bb0\u4fdd\u7559\uff09','Removed from saved; notes retained'));}
 else if(el.dataset.compare){const id=el.dataset.compare;if(!validIds.has(id))return;if(state.compare.has(id))state.compare.delete(id);else if(state.compare.size===3){notify(L('\u6700\u591a\u540c\u65f6\u5bf9\u6bd4 3 \u6761\u8d44\u6e90','Compare up to three resources'));return;}else state.compare.add(id);persist();refreshActionButtons();}
 else if(el.dataset.removeCompare){state.compare.delete(el.dataset.removeCompare);persist();refreshActionButtons();if(location.hash.startsWith('#/compare'))renderCompare();}
 else if(el.hasAttribute('data-clear-compare')){state.compare.clear();persist();refreshActionButtons();if(location.hash.startsWith('#/compare'))renderCompare();}
 else if(el.dataset.quick)quickView(el.dataset.quick);
 else if(el.dataset.noteDataset)datasetNote(el.dataset.noteDataset);
 else if(el.dataset.copyCitation){const d=ds(el.dataset.copyCitation);if(d)copyText(citationText(d));}
 else if(el.dataset.paperCopy){const p=findPaper(el.dataset.paperCopy);if(p)copyText(citation(p));}
 else if(el.dataset.paperSave){const k=el.dataset.paperSave;const n=space.paperNotes[k]||{text:'',status:'unread'};n.saved=!n.saved;n.updatedAt=now();space.paperNotes[k]=n;saveSpace();window.wbRefresh?.();}
 else if(el.dataset.paperNote)paperNote(el.dataset.paperNote);
 else if(el.dataset.citeKey){const p=findPaper(el.dataset.citeKey);if(p)downloadText('battery-reference.'+(el.dataset.citeFormat||'bib'),el.dataset.citeFormat==='ris'?risText(p):bibText(p));}
 else if(el.hasAttribute('data-backup'))exportBackup();
 else if(el.hasAttribute('data-import'))chooseBackup();
 else if(el.hasAttribute('data-new-folder'))folderEditor();
 else if(el.dataset.editFolder)folderEditor(el.dataset.editFolder);
});
router=()=>{
 closeDialog();nav.classList.remove('open');menuButton.setAttribute('aria-expanded','false');$('#display-settings')?.removeAttribute('open');routeController.abort();routeController=new AbortController();window.wbRefresh=null;
 const hash=location.hash||'#/',route=hash.slice(1).split('?')[0];currentHash=hash;
 if(route==='/')renderHome();else if(route==='/datasets')renderDatasets();else if(route==='/papers')renderPapers();else if(route==='/workspace')renderWorkspace();else if(route==='/hub')renderHub();else if(route==='/knowledge')renderKnowledge();else if(route==='/calculators')renderCalculators();else if(route==='/tools')renderTools();else if(route==='/compare')renderCompare();else if(route.startsWith('/dataset/'))renderDetail(route.split('/')[2]);else renderNotFound();
 const title=$('h1',app)?.textContent||'ADV BATTERY';document.title=title+' | ADV BATTERY';app.focus({preventScroll:true});updateCompareDock();updateChrome();
 const position=Number(scrolls[currentHash]||scrolls[hash]||0);requestAnimationFrame(()=>window.scrollTo({top:position,behavior:'instant'}));
};
if('scrollRestoration' in history)history.scrollRestoration='manual';
let scrollTimer;window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{scrolls[currentHash]=window.scrollY;saveBrowse();},100);},{passive:true});
window.addEventListener('beforeunload',()=>{scrolls[currentHash]=window.scrollY;saveBrowse();});
window.addEventListener('resize',()=>{if(!compareDock.hidden)document.body.style.setProperty('--dock-height',(compareDock.getBoundingClientRect().height+28)+'px');});
window.addEventListener('hashchange',router);
document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)&&!document.activeElement?.isContentEditable&&!document.querySelector('dialog[open]')){const input=$('#search-input')||$('#paper-search')||$('#home-query')||$('#workspace-search');if(input){e.preventDefault();input.focus();}}if(e.key==='Escape'){nav.classList.remove('open');menuButton.setAttribute('aria-expanded','false');$('#display-settings').removeAttribute('open');}});
// Close settings on outside interaction; its native <details> remains keyboard-operable.
document.addEventListener('click',e=>{if(!e.target.closest('#display-settings'))$('#display-settings').removeAttribute('open');});
window.BatteryWorkbench={version:'2.1.0',getWorkspace:()=>space,backupPayload,validateBackup,mergeBackup,matches,filtersFromURL,bibText,risText,canonical:paperKey};
if(!location.hash&&Store.getItem('advbattery:startup')==='datasets'){history.replaceState(null,'',browse.last||'#/datasets');}
router();
})();
